<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio Pessoal | Bootstrap</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Navbar Responsiva com seletor de tema -->
    <nav
      class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Mateus Milani</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="#sobre">Sobre</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#habilidades">Habilidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#projetos">Projetos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contato">Contato</a>
            </li>
            <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
              <!-- Botão de Alternância de Tema -->
              <button
                class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                id="theme-toggle"
                type="button"
                aria-label="Alternar tema"
              >
                <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <!-- As seções Hero, Sobre, Habilidades e Projetos entrarão aqui -->
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Customizado -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
